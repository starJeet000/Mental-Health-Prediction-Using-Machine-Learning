name: Render Keep Alive Cron

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-min idle spin-down
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://mental-health-prediction-using-machine-42cn.onrender.com
