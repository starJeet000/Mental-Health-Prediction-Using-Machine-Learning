<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Booking Confirmed</title>
  <!-- Bootstrap & Google Fonts & Favicon -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles-form.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/43124feaf5.js" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="static/images/favicon-16x16.png" type="image/x-icon">
</head>

<body>
  <section id="form-top"
    style="min-height: 100vh; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center;">

    <div
      style="background: rgba(255, 255, 255, 0.08); padding: 40px; border-radius: 15px; max-width: 650px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);">
      <i class="fas fa-check-circle" style="font-size: 4rem; color: #51cf66; margin-bottom: 20px;"></i>
      <h1 style="margin-bottom: 15px;">Session Booked Successfully!</h1>
      <hr style="width: 50%; margin: 20px auto; background-color: white; height: 2px;" />

      <p style="font-size: 1.2rem; line-height: 1.6; color: #e9ecef;">
        Thank you, <strong>{{ name }}</strong>. Your request for a counselling session has been received.
      </p>

      <p style="font-size: 1rem; color: #ced4da; margin-top: 15px;">
        A mental health specialist will contact you shortly at <strong>{{ email }}</strong> or <strong>{{ phone
          }}</strong> to confirm your slot time.
      </p>

      <div style="margin-top: 35px;">
        <a href="/" class="btn btn-primary"
          style="padding: 10px 30px; font-size: 1.1rem; background-color: #0d6efd; border: none;">Return to Home
          Page</a>
      </div>
    </div>

  </section>
</body>

</html>
